<!DOCTYPE html>
<html>
<head>
    <title>Student Event Registration</title>
    <style>
        body {
            text-align: center;
            font-family: Arial;
            background-color: lightblue;
        }

        h1 {
            color: darkblue;
        }

        h2 {
            color: darkgreen;
        }

        form {
            background-color: white;
            padding: 20px;
            margin: 30px auto;
            width: 400px;
            border-radius: 10px;
        }

        input {
            margin: 8px;
            padding: 8px;
            width: 80%;
        }

        button {
            padding: 10px 20px;
        }
    </style>
</head>

<body>

    <h1>Student Event Registration</h1>

    <h2>Tech Fest 2026</h2>

    <p>
        Join our annual technology event featuring technical talks,
        competitions and innovative projects.
    </p>

    <form>
        <input type="text" placeholder="Student Name"><br>

        <input type="text" placeholder="Register Number"><br>

        <input type="text" placeholder="Department"><br>

        <input type="email" placeholder="Email"><br>

        <input type="date"><br>

        <button type="submit">Register</button>
    </form>

</body>
</html>
