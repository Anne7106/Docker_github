apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-portal
spec:
  replicas: 3
  selector:
    matchLabels:
      app: college-portal
  template:
    metadata:
      labels:
        app: college-portal
    spec:
      containers:
        - name: college-portal
          image: catherine7/college-department-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80

---
apiVersion: v1
kind: Service
metadata:
  name: college-portal-service
spec:
  type: NodePort
  selector:
    app: college-portal
  ports:
    - port: 80
      targetPort: 80
      nodePort: 30080