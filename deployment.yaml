apiVersion: apps/v1
kind: Deployment
metadata:
  name: college-event-portal
spec:
  replicas: 3
  revisionHistoryLimit: 5
  strategy:
    type: RollingUpdate
    rollingUpdate:
      maxSurge: 1
      maxUnavailable: 0
  selector:
    matchLabels:
      app: college-event-portal
  template:
    metadata:
      labels:
        app: college-event-portal
    spec:
      containers:
        - name: event-portal
          image: catherine7/college-event-portal:latest
          imagePullPolicy: Always
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 3
            periodSeconds: 5